<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#8ecae6" />
  <title>Hydra — your water companion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="sky">
    <div id="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div id="stars"></div>
    <div id="hill-back"></div>
    <div id="garden"></div>
  </div>

  <main id="app">
    <header>
      <h1>Hydra</h1>
      <button id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <section id="plant-stage" aria-label="Your plant">
      <div id="plant-wrap">
        <svg id="plant" viewBox="0 0 200 260" role="img" aria-label="Your companion plant">
          <defs>
            <linearGradient id="pot-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e08a4e"/>
              <stop offset="1" stop-color="#b05a2a"/>
            </linearGradient>
            <linearGradient id="rim-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ef9a60"/>
              <stop offset="1" stop-color="#cd7038"/>
            </linearGradient>
          </defs>
          <g id="pot">
            <ellipse cx="100" cy="254" rx="52" ry="9" fill="rgba(0,0,0,0.18)"/>
            <path d="M55 190 L145 190 L133 250 Q132 258 124 258 L76 258 Q68 258 67 250 Z" fill="url(#pot-grad)"/>
            <path d="M67 250 Q68 258 76 258 L124 258 Q132 258 133 250 L134 244 L66 244 Z" fill="#9c4c22"/>
            <path d="M50 178 L150 178 L150 196 L50 196 Z" fill="url(#rim-grad)"/>
            <ellipse id="soil" cx="100" cy="190" rx="46" ry="8" fill="#5b3a29"/>
            <ellipse cx="100" cy="188" rx="40" ry="6" fill="#6e4936"/>
          </g>
          <g id="droplet" opacity="0">
            <path d="M100 40 C92 55 84 66 84 76 a16 16 0 0 0 32 0 C116 66 108 55 100 40 Z" fill="#63c7f2"/>
          </g>
          <g id="plant-body" transform-origin="100 190">
            <g id="plant-inner"></g>
          </g>
        </svg>
        <div id="speech-bubble" aria-live="polite">Good morning! I'm your little seed 🌱</div>
      </div>
    </section>

    <section id="progress-card">
      <div class="progress-row">
        <span id="progress-label">0.0 L of 2.0 L</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill"></div>
      </div>
      <p id="last-glass">No glass logged yet today</p>
    </section>

    <section id="action-bar">
      <button id="drink-btn">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 2 C9.5 6 7 9.2 7 12.5 a5 5 0 0 0 10 0 C17 9.2 14.5 6 12 2 Z"/>
        </svg>
        <span>I drank a glass</span>
      </button>
    </section>
  </main>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <label for="goal-input">Daily goal (liters)</label>
      <input id="goal-input" type="number" min="0.5" max="5" step="0.1" inputmode="decimal" />
      <label for="glass-size-input">Glass size (ml)</label>
      <input id="glass-size-input" type="number" min="100" max="500" step="25" inputmode="numeric" />
      <label for="reminder-input">Remind me after (minutes without water)</label>
      <input id="reminder-input" type="number" min="15" max="240" step="15" inputmode="numeric" />
      <label class="checkbox-row">
        <input id="notif-toggle" type="checkbox" />
        <span>Enable notifications (needs permission)</span>
      </label>
      <div class="modal-actions">
        <button id="close-settings">Done</button>
      </div>
    </div>
  </div>

  <div id="toast" aria-live="polite"></div>

  <script src="growth.js"></script>
  <script src="plants.js"></script>
  <script src="app.js"></script>
</body>
</html>
