<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom &amp; Sip — your water companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="sky"></div>
<div id="clouds"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span></div>

<header id="topbar">
  <div class="brand">
    <span class="brand-leaf" aria-hidden="true">🌱</span>
    <h1>Bloom &amp; Sip</h1>
  </div>
  <div class="top-right">
    <span id="today-label"></span>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
  </div>
</header>

<main id="main">
  <section id="stage-card" aria-live="polite">
    <div id="plant-area">
      <div id="drops"></div>
      <svg id="plant-svg" class="stage-0" viewBox="0 0 200 280" role="img" aria-label="Your virtual plant">
        <g id="pot">
          <path d="M64,226 L136,226 L126,272 L74,272 Z" fill="#b5654a"/>
          <path d="M64,226 L136,226 L133,240 L67,240 Z" fill="#a0563e"/>
          <rect x="56" y="208" width="88" height="18" rx="6" fill="#cd7a5b"/>
          <rect x="56" y="208" width="88" height="7" rx="3.5" fill="#e08a6b"/>
          <ellipse cx="100" cy="213" rx="40" ry="6" fill="#6b4a33"/>
        </g>
        <ellipse id="seed" cx="100" cy="209" rx="6" ry="8" fill="#8a5a2e"/>
        <g id="stem">
          <path d="M100,210 C97,172 103,132 100,84" fill="none" stroke="#3f9d55" stroke-width="7" stroke-linecap="round"/>
        </g>
        <g id="leaves" fill="#4caf62">
          <path id="leafL" d="M100,178 C78,174 66,158 68,144 C86,147 99,160 100,178 Z"/>
          <path id="leafR" d="M100,158 C122,154 134,138 132,124 C114,127 101,140 100,158 Z"/>
          <path id="leafL2" d="M100,196 C86,193 78,182 79,172 C91,174 99,184 100,196 Z"/>
          <path id="leafR2" d="M100,190 C114,187 122,176 121,166 C109,168 101,178 100,190 Z"/>
        </g>
        <g id="flower" transform="translate(100,78)">
          <g id="petals" fill="#ff8fb3">
            <ellipse cx="0" cy="-16" rx="9" ry="17"/>
            <ellipse cx="0" cy="-16" rx="9" ry="17" transform="rotate(60)"/>
            <ellipse cx="0" cy="-16" rx="9" ry="17" transform="rotate(120)"/>
            <ellipse cx="0" cy="-16" rx="9" ry="17" transform="rotate(180)"/>
            <ellipse cx="0" cy="-16" rx="9" ry="17" transform="rotate(240)"/>
            <ellipse cx="0" cy="-16" rx="9" ry="17" transform="rotate(300)"/>
          </g>
          <circle r="8" fill="#ffd54f"/>
        </g>
      </svg>
      <div id="plant-shadow"></div>
    </div>

    <p id="status-text">A new seed was potted this morning. Give it some water!</p>

    <button id="drink-btn">
      <span class="drop-icon">💧</span> I drank a glass of water
    </button>

    <div id="progress-wrap">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-label"></span>
    </div>
    <p id="next-hint"></p>
  </section>

  <section id="garden-card">
    <h2>🌷 Your thriving garden</h2>
    <p class="garden-sub">Every day your plant blooms, a flower joins the garden.</p>
    <div id="garden-row"></div>
    <p id="garden-empty">No bloomed plants yet — today could be the first flower!</p>
  </section>
</main>

<div id="notify-banner" class="hidden"></div>

<div id="settings-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="modal-card">
    <h2 id="settings-title">⚙️ Settings</h2>
    <label class="field">
      <span>Daily goal (liters) — how much water makes your plant bloom</span>
      <input id="set-goal" type="number" min="0.25" max="10" step="0.25">
    </label>
    <label class="field">
      <span>Glass size (ml)</span>
      <input id="set-glass" type="number" min="50" max="1000" step="10">
    </label>
    <label class="field">
      <span>Remind me if I haven't drunk for (minutes)</span>
      <input id="set-notify" type="number" min="15" max="480" step="5">
    </label>
    <div class="modal-actions">
      <button id="settings-save" class="primary-btn">Save</button>
      <button id="settings-close" class="ghost-btn">Close</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
